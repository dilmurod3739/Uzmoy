name: Build Android APK for UZMOY

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Web Assets in Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp styles.css android/app/src/main/assets/
          cp app.js android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp sw.js android/app/src/main/assets/ || true
          cp icon-192.png android/app/src/main/assets/ || true
          cp icon-512.png android/app/src/main/assets/ || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android APK with Gradle
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UZMOY-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "UZMOY Mobil Ilovasi (Android APK)"
          body: |
            ### 🚗 UZMOY — Oliy Toifali Avtomoyka va Detailing Platformasi
            Eng so'nggi yangilangan Android ilovasi (.apk).
            
            - **Versiya:** 2.3.0
            - **To'liq moslashuv:** Smartfonlar, planshetlar va Android WebView
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
